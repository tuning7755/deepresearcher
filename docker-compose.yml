version: "3.9"

services:
  deepagents:
    build: .
    image: deepagents-4-skills
    container_name: deepagents-4-skills
    working_dir: /workspace
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/workspace/src
    volumes:
      - /data/qxu/deepagents-4-skills:/workspace

    command: uvicorn deepresearcher.api.app:app --host 0.0.0.0 --port 8000


